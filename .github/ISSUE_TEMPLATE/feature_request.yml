name: Feature request
description: Suggest an improvement
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem would this solve?, description: Describe the use case rather than the solution. }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
  - type: checkboxes
    id: privacy
    attributes:
      label: Principles check
      options:
        - label: This does not add tracking, fingerprinting or third-party calls.
        - label: I considered accessibility (keyboard, screen reader, no-pointer users).
